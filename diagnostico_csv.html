<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagnóstico CSV - Liga Inferiores</title>
<style>
  body { font-family: -apple-system, sans-serif; padding: 16px; background:#111; color:#eee; }
  h1 { font-size: 18px; }
  .test { border:1px solid #444; border-radius:8px; padding:12px; margin-bottom:12px; }
  .ok { border-color:#2e7d32; background:#0d2b0f; }
  .fail { border-color:#c62828; background:#2b0d0d; }
  .pending { border-color:#f9a825; background:#2b230d; }
  pre { white-space:pre-wrap; word-break:break-all; font-size:12px; background:#000; padding:8px; border-radius:6px; max-height:150px; overflow:auto; }
  button { padding:10px 16px; background:#1565C0; color:#fff; border:none; border-radius:6px; font-size:14px; margin-bottom:16px; }
</style>
</head>
<body>
<h1>Diagnóstico: fetch CSV desde Google Sheets</h1>
<button onclick="runAll()">▶ Correr diagnóstico</button>
<div id="out"></div>

<script>
const SHEET_ID = "1qYTmJhjr6BCjByXyNyKb69Iiwyce1rhpjQl22OQzAtQ";
const SHEET_NAMES = ["Sub 12 Fem", "Sub 14 Fem", "Sub 16 Fem", "Sub 18 Fem"];

function csvUrl(sheetName) {
  return 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv&sheet=' + encodeURIComponent(sheetName) + '&t=' + Date.now();
}

function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else { inQuotes = false; }
      } else {
        field += c;
      }
    } else if (c === '"') {
      inQuotes = true;
    } else if (c === ',') {
      row.push(field); field = '';
    } else if (c === '\r') {
      // ignorado
    } else if (c === '\n') {
      row.push(field); field = '';
      rows.push(row); row = [];
    } else {
      field += c;
    }
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows;
}

async function testSheet(name, div) {
  const url = csvUrl(name);
  div.innerHTML = `<b>${name}</b><br><pre>${url}</pre><div class="status">⏳ Probando...</div>`;
  try {
    const res = await fetch(url, { cache: 'no-store' });
    const text = await res.text();
    if (!res.ok) {
      div.className = 'test fail';
      div.querySelector('.status').innerHTML = `❌ HTTP ${res.status}<br><pre>${text.slice(0,300)}</pre>`;
      return;
    }
    if (!text || !text.trim()) {
      div.className = 'test fail';
      div.querySelector('.status').innerHTML = `❌ Respuesta vacía (status ${res.status})`;
      return;
    }
    const rows = parseCSV(text);
    const fechaHits = [];
    rows.forEach((r, ri) => {
      r.forEach((cell, ci) => {
        if (/^Fecha\s+\d/i.test(String(cell||'').trim())) {
          fechaHits.push({ row: ri, col: ci, text: cell });
        }
      });
    });
    const fechaRowsCol0 = rows.filter(r => /^Fecha\s+\d/i.test(String(r[0]||'').trim()));
    const withLocalVisit = rows.filter(r => String(r[10]||'').trim() && String(r[13]||'').trim() && r[10] !== 'Local');
    let colCounts = {};
    rows.forEach(r => { colCounts[r.length] = (colCounts[r.length]||0)+1; });
    const status = fechaRowsCol0.length > 0 ? 'ok' : (fechaHits.length > 0 ? 'pending' : 'fail');
    div.className = 'test ' + status;
    div.querySelector('.status').innerHTML = `
      ${status === 'ok' ? '✅' : '⚠️'} ${rows.length} filas totales, ${text.length} caracteres<br>
      "Fecha N" en columna 0: <b>${fechaRowsCol0.length}</b><br>
      "Fecha N" en CUALQUIER columna: <b>${fechaHits.length}</b><br>
      ${fechaHits.length ? 'Columnas donde aparece: <b>' + [...new Set(fechaHits.map(h=>h.col))].join(', ') + '</b><br>' : ''}
      Filas con Local+Visitante (col 10/13): <b>${withLocalVisit.length}</b><br>
      Distribución de largo de fila: <code>${JSON.stringify(colCounts)}</code><br>
      Primeros 5 hits de "Fecha": <pre>${fechaHits.slice(0,5).map(h=>'fila '+h.row+', col '+h.col+': '+JSON.stringify(h.text)).join('\n')}</pre>
      Fila completa donde aparece el primer hit: <pre>${fechaHits.length ? JSON.stringify(rows[fechaHits[0].row]) : '(ninguno)'}</pre>
      <button onclick="this.nextElementSibling.style.display='block';this.style.display='none';">Ver primeras 30 filas parseadas (con índice)</button>
      <pre style="display:none;max-height:400px;">${rows.slice(0,30).map((r,i)=>i+': '+JSON.stringify(r)).join('\n').replace(/</g,'&lt;')}</pre>
      <button onclick="this.nextElementSibling.style.display='block';this.style.display='none';">Ver CSV crudo completo</button>
      <pre style="display:none;max-height:400px;">${text.replace(/</g,'&lt;')}</pre>
    `;
  } catch (e) {
    div.className = 'test fail';
    div.querySelector('.status').innerHTML = `❌ EXCEPCIÓN JS: ${e.name}: ${e.message}`;
  }
}

async function runAll() {
  const out = document.getElementById('out');
  out.innerHTML = '';
  for (const name of SHEET_NAMES) {
    const div = document.createElement('div');
    div.className = 'test pending';
    out.appendChild(div);
    await testSheet(name, div);
  }
}
</script>
</body>
</html>
